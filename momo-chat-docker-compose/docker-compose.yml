version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka

  momo-chat:
    build:
      context: ../momo-chat             # 서비스 폴더 위치 (현재 기준 상대 경로)
      dockerfile: Dockerfile
    container_name: momo-chat
    ports:
      - "5000:5000"
    environment:
      DB_USERNAME: challengers
      DB_PASSWORD: challengers
      MONGO_REPLICA_ADDRESS: mongo1:27017,mongo2:27018,mongo3:27019
      MONGO_DATABASE_NAME: chatdb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_TOPIC_NAME: momo-chat-topic
      REDIS_MASTER: mymaster
      REDIS_PORT1: redis-sentinel-1:26379
      REDIS_PORT2: redis-sentinel-2:26379
      REDIS_PORT3: redis-sentinel-3:26379
    depends_on:
      - kafka
      - mongo1
      - mongo2
      - mongo3

  mongo1:
    image: mongo
    container_name: mongo1
    hostname: mongo1
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: challengers
      MONGO_INITDB_ROOT_PASSWORD: challengers
    command: >
        bash -c "
            chmod 400 /etc/mongo/mongodb.key &&
            exec mongod --replSet rs0 --keyFile /etc/mongo/mongodb.key --bind_ip_all
        "
    volumes:
      - ./mongodb.key:/etc/mongo/mongodb.key
      - mongo1-data:/data/db

  mongo2:
    image: mongo
    container_name: mongo2
    hostname: mongo2
    restart: always
    ports:
      - "27018:27018"
    environment:
      MONGO_INITDB_ROOT_USERNAME: challengers
      MONGO_INITDB_ROOT_PASSWORD: challengers      
    command: >
        bash -c "
            chmod 400 /etc/mongo/mongodb.key &&
            exec mongod --replSet rs0 --keyFile /etc/mongo/mongodb.key --bind_ip_all
        "
    volumes:
      - ./mongodb.key:/etc/mongo/mongodb.key
      - mongo2-data:/data/db

  mongo3:
    image: mongo
    container_name: mongo3
    hostname: mongo3
    restart: always
    ports:
      - "27019:27019"
    environment:
      MONGO_INITDB_ROOT_USERNAME: challengers
      MONGO_INITDB_ROOT_PASSWORD: challengers
    command: >
        bash -c "
            chmod 400 /etc/mongo/mongodb.key &&
            exec mongod --replSet rs0 --keyFile /etc/mongo/mongodb.key --bind_ip_all
        "
    volumes:
      - ./mongodb.key:/etc/mongo/mongodb.key
      - mongo3-data:/data/db

  redis-master:
    image: redis:7.2
    container_name: redis-master
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes

  redis-slave-1:
    image: redis:7.2
    container_name: redis-slave-1
    ports:
      - "6381:6379"
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    depends_on:
      - redis-master

  redis-slave-2:
    image: redis:7.2
    container_name: redis-slave-2
    ports:
      - "6382:6379"
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    depends_on:
      - redis-master

  redis-sentinel-1:
    build: ./sentinel
    container_name: redis-sentinel-1
    ports:
      - "26379:26379"
    env_file:
      - .env
    depends_on:
      - redis-master
      - redis-slave-1
      - redis-slave-2

  redis-sentinel-2:
    build: ./sentinel
    container_name: redis-sentinel-2
    ports:
      - "26380:26379"
    env_file:
      - .env
    depends_on:
      - redis-master
      - redis-slave-1
      - redis-slave-2

  redis-sentinel-3:
    build: ./sentinel
    container_name: redis-sentinel-3
    ports:
      - "26381:26379"
    env_file:
      - .env
    depends_on:
      - redis-master
      - redis-slave-1
      - redis-slave-2

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data: